spring.application.name=backend
server.port=${PORT:8080}


spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

bedrock.region=${AWS_REGION:ap-south-1}
bedrock.model-id=${BEDROCK_MODEL_ID:openai.gpt-oss-20b}
app.mcp.repo-url=${MCP_REPO_URL:http://localhost:8081/mcp}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://buildspace-ai.pages.dev,http://localhost:5173}
